[project]
name = "semantic-layer-workshop"
version = "0.1.0"
description = "A workshop walking through how to build and utilize a semantic layer graph with Neo4j."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.35.1",
    "ipykernel>=7.2.0",
    "langchain>=1.3.4",
    "langchain-litellm>=0.6.6",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "neocarta>=0.4.0",
    "python-dotenv>=1.2.2",
]
